name: Build IMGUIDELTA (Xcode)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install XcodeGen
      - name: Install XcodeGen
        run: |
          brew install xcodegen

      # Download exploit code from FilzaSlop
      - name: Download FilzaSlop Exploit Code
        run: |
          echo "Downloading FilzaSlop exploit framework..."
          git clone --depth 1 --filter=blob:none --sparse https://github.com/0xjohnnydev/FilzaSlop.git filzaslop_src
          cd filzaslop_src
          git sparse-checkout set --no-cone kexploit kpf XPF utils compat sandbox_escape.m sandbox_escape.h apfs_own.m apfs_own.h MCMBridge.m MCMBridge.h MCMFilzaIntegration.m MCMFilzaIntegration.h
          cd ..

          # Copy exploit directories
          echo "Copying exploit code..."
          cp -r filzaslop_src/kexploit . 2>/dev/null || mkdir -p kexploit
          cp -r filzaslop_src/kpf . 2>/dev/null || mkdir -p kpf
          cp -r filzaslop_src/XPF . 2>/dev/null || mkdir -p XPF
          cp -r filzaslop_src/utils . 2>/dev/null || mkdir -p utils
          cp -r filzaslop_src/compat . 2>/dev/null || mkdir -p compat

          # Copy sandbox escape files
          cp filzaslop_src/sandbox_escape.m . 2>/dev/null || true
          cp filzaslop_src/sandbox_escape.h . 2>/dev/null || true
          cp filzaslop_src/apfs_own.m . 2>/dev/null || true
          cp filzaslop_src/apfs_own.h . 2>/dev/null || true

          # Copy MCM integration files (CRITICAL!)
          echo "Copying MCM integration files..."
          cp filzaslop_src/MCMBridge.m Sources/ 2>/dev/null || echo "Warning: MCMBridge.m not found in FilzaSlop"
          cp filzaslop_src/MCMBridge.h Sources/ 2>/dev/null || echo "Warning: MCMBridge.h not found in FilzaSlop"
          cp filzaslop_src/MCMFilzaIntegration.m Sources/ 2>/dev/null || echo "Warning: MCMFilzaIntegration.m not found in FilzaSlop"
          cp filzaslop_src/MCMFilzaIntegration.h Sources/ 2>/dev/null || echo "Warning: MCMFilzaIntegration.h not found in FilzaSlop"

          # Cleanup
          rm -rf filzaslop_src

          echo "✓ Exploit code ready"

      # Generate Xcode project from XcodeGen
      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "✓ Xcode project generated"
          ls -lah IMGUIDELTA.xcodeproj/

      # Build with Xcode
      - name: Build IMGUIDELTA
        run: |
          xcodebuild \
            -scheme IMGUIDELTA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -verbose

      # Create IPA from built app
      - name: Package IPA
        run: |
          echo "Creating IPA from built app..."
          BUILT_APP="build/Build/Products/Release-iphoneos/IMGUIDELTA.app"

          if [ ! -d "$BUILT_APP" ]; then
            echo "Error: Built app not found at $BUILT_APP"
            find build -name "*.app" -type d
            exit 1
          fi

          mkdir -p Payload
          cp -r "$BUILT_APP" Payload/
          zip -qr DeltaProxyVN-1.4.0.ipa Payload/

          if [ -f "DeltaProxyVN-1.4.0.ipa" ]; then
            echo "✓ IPA created: DeltaProxyVN-1.4.0.ipa"
            unzip -l DeltaProxyVN-1.4.0.ipa | head -20
            ls -lh DeltaProxyVN-1.4.0.ipa
          else
            echo "Error: IPA creation failed"
            exit 1
          fi

      # Upload artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMGUIDELTA-IPA
          path: DeltaProxyVN-1.4.0.ipa
          retention-days: 30

      # Create auto-tag
      - name: Create Release Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="v1.4.0"
          echo "Creating tag: $TAG"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Xcode Release $TAG - Build ${{ github.run_number }}" || echo "Tag already exists"
          git push origin "$TAG" 2>/dev/null || true
          echo "TAG=$TAG" >> $GITHUB_ENV

      # Create GitHub Release
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          files: DeltaProxyVN-1.4.0.ipa
          draft: false
          prerelease: false
          body: |
            **IMGUIDELTA Build ${{ github.run_number }} (Xcode)**

            Unsigned IPA generated from commit ${{ github.sha }}

            **Built with:**
            - Xcode + XcodeGen
            - FilzaSlop sandbox escape framework
            - iOS 15.0+ support

            **Installation:**
            1. Download IPA below
            2. Sign with esign or codesign:
               ```bash
               esign -s cert.p12:password -p provision.mobileprovision DeltaProxyVN-1.4.0.ipa
               ```
            3. Install via Sideloadly/AltStore/TrollStore

            **Notes:**
            - Unsigned debug IPA
            - Manual signing required before installation
            - Sandbox escape features device/iOS version dependent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
